[pytest]
markers =
    slow: long-running training comparison

# The retired tree is not collected. R10 P0 it.4 moved 32 ATTIC rows under attic/;
# without this, `pytest` from the root still collects them -- the move would retire
# nothing -- and the three attic/tests/chase/test_multizoom_*.py files ERROR at
# collection, because their `from conftest import requires_triton` resolved through
# tests/chase/conftest.py, which is KEEP and did not move with them.
# An explicitly-named path still collects, which is what the attic-aware guards need.
# kaggle/ holds a REGENERATED snapshot of this repo (kaggle/snapshot/repo/), so every
# test basename exists twice. pytest imports the snapshot copy first and then refuses
# the real one with "import file mismatch", and because that is a COLLECTION error the
# run aborts before a single test executes -- `pytest -q` at the root read
# `201 errors during collection`, 0 tests run, while `pytest tests/x35p/test_source.py`
# on its own read `15 passed`. A dead suite reports no failures, which is why nothing
# caught it: green and uncollectable look identical from the summary line.
norecursedirs = attic kaggle *.egg .* _darcs build CVS dist node_modules venv {arch}

# The same failure mode as the paragraph above, recurred at 19 instead of 201, and
# still unguarded: a collection error aborts the WHOLE session, so pytest runs zero of
# the tests it already collected. Measured at HEAD 1d7863f on WIN (Python 3.11.9, CPU,
# torch 2.14.0+cpu): `python -m pytest --collect-only -q` reads `3265 tests collected,
# 19 errors in 20.04s` preceded by `!!! Interrupted: 19 errors during collection !!!`;
# the same command with the flag below reads `3265 tests collected, 19 errors in
# 15.42s` and no Interrupt. Collection costs 20 s, so the suite's never having
# completed on one CPU was never a collection cost -- it was this abort.
#
# The flag hides nothing: each of the 19 still prints as ERROR and the exit status
# stays non-zero. Their three causes, none of them a test's own verdict:
#   1. 10 files -- torchvision 0.20.1+cu121 is built against torch 2.5.1 while torch
#      2.14.0 is installed, so `import torchvision` raises `RuntimeError: operator
#      torchvision::nms does not exist`, and transformers 5.3.0's lazy
#      `PreTrainedModel` import fails behind it (8 of the 10 report only that).
#   2. 9 files -- c71527a ("Remove the round reports from the tree") deleted 56 test
#      files, 5 of which 9 survivors still import at module scope (e.g.
#      tests/saturn/test_v20_r15_freeze_manifest.py, imported by
#      tests/mars_v20/test_it18_wing_identity_is_self_certified.py:36). The sweep
#      matched filenames and never grepped for importers.
#   3. 1 file -- tests/curvature/test_chess_probe_protocol.py:54 raises at MODULE
#      scope when the staged Kaggle kernel is absent. The raise is deliberate (:49-53
#      argues a skip reads as "nothing to run"), but at module scope it takes the
#      session down with it instead of reporting eight REDs.
addopts = --continue-on-collection-errors
