site_name: resolvent
site_description: One causal head, three switches. Softmax attention, unnormalized-kernel attention and the exact path product of a Markov chain as settings of one operator, proved in Lean 4, with every failure kept on the record.
site_author: Teerth Sharma
site_url: https://teerthsharma.github.io/resolvent/
repo_url: https://github.com/teerthsharma/resolvent
repo_name: teerthsharma/resolvent
edit_uri: ""
copyright: Invented by <a href="https://teerthsharma.vercel.app/">Teerth Sharma</a> · Apache License 2.0

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Instrument Sans
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/resolvent.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/resolvent.js
  - path: assets/scene.js
    type: module

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/teerthsharma/resolvent
    - icon: fontawesome/solid/globe
      link: https://teerthsharma.vercel.app/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: "#"
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# MkDocs builds from the working tree, so the gitignored local drafts in docs/ are
# excluded by name: nothing reaches the public site that is not in the repository.
exclude_docs: |
  ARCHITECTURE_OPTIONS.md
  CEQ_JEPA_PLAN.md

# The paper's working sources are published but not listed; sources/README.md indexes them.
not_in_nav: |
  sources/**

nav:
  - Home: index.md
  - "Status: done against total": STATUS.md
  - "North Star: the forward S-matrix reconciliation": NORTH_STAR.md
  - The record:
      - Everything retracted, broken or open: FAILS.md
      - Component ledger: COMPONENT_LEDGER.md
      - Research plan: PLAN.md
      - Corner rule retirement: CORNER_RULE_RETIREMENT.md
      - Kaggle card: PI_JEPA_KAGGLE_CARD.md
      - DR2 card: DR2_CARD.md
      - "Pre-registration: BED-H": BED_H_PREREGISTRATION.md
      - "Pre-registration: REMOVAL-ECHO v1": prereg/REMOVAL_ECHO_v1.md
      - "Certificate C9: the NEVER residue": C9_NEVER_RESIDUE.md
      - "What the dispatcher got wrong, 2026-09-20": SESSION_ERRORS_2026_09_20.md
      - "Phase G: spectral": PHASE_G.md
      - "Phase H: bind": PHASE_H.md
      - "Phase I: calibrate and cost": PHASE_I.md
      - "Phase I.1: repair": PHASE_I1.md
      - "Prior art: the mass gate": PRIOR_ART_MASS_GATE.md
  - Ledgers:
      - Failure mechanisms: ledgers/mistakes.md
      - Struck constants: ledgers/struck.md
      - Mathematics: ledgers/mathematics.md
      - Model card: ledgers/model-card.md
      - Costs: ledgers/costs.md
      - V17K rulings: ledgers/v17k-rulings.md
      - V16 calibration: ledgers/v16-calibration.md
  - Canon:
      - Charter: canon/CHARTER.md
      - 01 Theory of accuracy: canon/01_THEORY_ACCURACY.md
      - 02 Theory of training: canon/02_THEORY_TRAINING.md
      - 03 Kernel: canon/03_KERNEL.md
      - 04 Beds and instruments: canon/04_BEDS_AND_INSTRUMENTS.md
      - 05 Repairs: canon/05_REPAIRS.md
      - 06 Predictions: canon/06_PREDICTIONS.md
      - 08 Architecture: canon/08_ARCHITECTURE.md
      - 09 Chess and markets: canon/09_CHESS_AND_MARKETS.md
      - Corrections: canon/CORRECTIONS.md
  - Paper:
      - The shape of CEQ: CEQ_SHAPE.md
      - Paper sources: sources/README.md
      - Bibliography audit: BIB_AUDIT.md
      - Bibliography aliases: BIB_ALIASES.md
