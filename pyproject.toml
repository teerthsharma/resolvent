[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolvent"
version = "0.1.0"
description = "Candidate-set resolvent operators, a D-JEPA-spec relational operator and two exact-truth beds for ranking a JEPA planner's candidates"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Teerth Sharma", email = "teerths57@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://teerthsharma.vercel.app/"

[tool.setuptools.packages.find]
include = ["resolvent"]

[tool.ruff]
line-length = 120
